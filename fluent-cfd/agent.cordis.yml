# The `fluent-cfd` agent preset: a Fluent CFD engineer agent.
#
# Built from the shipped `standard` composition and overlayed with (1) a
# Fluent/PyFluent specialist persona and (2) the local `ansys-fluent-mcp`
# MCP execution layer. The judgment/workflow knowledge ships as a bundled
# preset skill under `skills/fluent-cfd/`.
#
# Plane rules preserved from `standard`:
#   - A row that PUBLISHES a service must sit inside a group carrying an
#     `isolate` realm. `mcp-pyfluent` (@deepseek-ai/dsh-mcp-client) only
#     CONSUMES `ctx.tools` and the tool registry is layered per scope, so
#     it sits loose like the other model-facing tool rows.
#   - Compaction, plan-mode and delegation/workflows keep their isolation.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      You are a Fluent CFD engineer agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You drive ANSYS Fluent through the local `ansys-fluent-mcp` MCP server; its tools are exposed as `mcp__fluent__*`. It is a STATELESS leaf: `run_code` mutates the live solver immediately, with no undo/plan/journal. You are the judgment layer on top of it.

      ## Non-negotiable guardrails
      - Define the physics BEFORE touching the solver: objective quantity, geometry, units, fluid(s), regime, compressibility, heat transfer, multiphase, rotating/moving zones, and expected validation evidence.
      - Residual decrease alone is NOT convergence. Require monitor stabilization and conservation checks for the quantities that matter.
      - Do not skip mesh quality, units, boundary-zone naming, boundary-condition consistency, or wall-resolution checks.
      - Do not change turbulence models without a physical reason or a stated validation purpose.
      - Before starting Fluent or consuming a license, state that the action will launch Fluent and may occupy a license/session; end live sessions with `disconnect` when done (keep a GUI run open only via `solver_loop.py --keep-open`).
      - Show the user the generated PyFluent code before `run_code`, and run `validate_code` first for safety-critical operations. The server rejects `.tui.*` calls — use `solver.settings.*`.
      - If a tool returns an error, STOP the sequence, summarize the failure, and propose the smallest safe recovery. Do not retry the same snippet blindly.

      ## How to use this agent
      Use the `fluent-cfd` skill as the workflow and judgment layer: it holds the full tool map, safe call order, all verified pitfalls (launch/dimension, field data, console capture, sandbox limits, reacting gotchas), and the long-run execution guidance. NEVER drive a long block-iteration with `run_code` — run it through the host + MCP-attach workflow (`scripts/fluent_host.py` + `go.json`/`run_status.json`/`control.json`), or fall back to `solver_loop.py` / `long_run.journal` (per-call timeout kills the session).

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── Fluent execution layer (MCP) ────────────────────────────────────────────

# The local `ansys-fluent-mcp` server (the official `ansys/pyfluent-mcp`
# package). It registers tools on `ctx.tools` under `mcp__fluent__*`; it
# publishes no service, so no isolate realm is needed. Tool call timeouts are
# raised well above the default because solver operations (iterate, connect)
# routinely exceed 60s. NOTE: this command is trusted executable code running
# outside the agent sandbox — keep `command` pinned to the installed package.
# `serverName` must be unique process-wide; `fluent` is chosen so two
# standalone mounts of this preset never collide on the namespace.
- id: mcp-fluent
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: fluent
    transport: stdio
    # `command` and `env` below are TEMPLATE TOKENS. `install.ps1` / `install.sh`
    # detect the machine values and substitute them (or set env `PYTHON_ANSYS_FLUENT_MCP`
    # and `ANSYS_AWP_ROOT` before installing). Do not edit by hand if you use the script.
    command: '__PYTHON_ANSYS_FLUENT_MCP__'
    args: ['--transport', 'stdio']
    toolCallTimeoutMs: 180000
    # Inject the Ansys AWP root so PyFluent can auto-locate Fluent in this
    # server process. Without these, `launch_fluent` raises 'AWP_ROOT252' and
    # the agent has to fall back to a `fluent_path` workaround. `dsh-mcp-client`
    # merges this `env` onto scrubbed ambient env at spawn (transport.ts).
    env:
      # install.ps1 / install.sh replace __AWP_ROOT_VARNAME__ with the version-specific
      # var (e.g. AWP_ROOT241 for 24R2, AWP_ROOT252 for 25.2) and __ANSYS_AWP_ROOT__ with
      # the detected ANSYS install dir. Supports 24R2 and later.
      __AWP_ROOT_VARNAME__: '__ANSYS_AWP_ROOT__'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
